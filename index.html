<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1420">
<title>개미 거래소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one phone-width trading app, screens swapped in place, bottom tab bar; deliberate single dark theme */
:root {
  --bg: #0E1420; --surface: #172033; --surface-2: #1E2A42; --line: #243049;
  --fg: #E8ECF4; --soft: #B8C1D3; --muted: #8A94A8;
  --up: #FF6B70; --down: #5B9BFF; --up-btn: #D63A40; --down-btn: #2F6FE0;
  --up-tint: #3A2027; --down-tint: #1C2A48; --live: #3DD68C; --gold: #F2C94C;
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
/* 페이지 전체가 아니라 body 안에서만 스크롤: 폰 브라우저가 주소창을 숨기며 화면을 상태바 밑까지 늘리지 않게 */
html { overflow: hidden; }
body { overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--down); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--soft); }

.app { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 170px; display: flex; flex-direction: column; gap: 16px; }
.app.detail-mode { padding-bottom: 300px; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-size: 21px; font-weight: 700; letter-spacing: -0.4px; margin: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--soft); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 2s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .35; } }

.card { background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 13px; color: var(--muted); }
.big { font-size: 27px; font-weight: 700; letter-spacing: -0.6px; }
.split { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.divider { padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.rank-btn { border: 0; background: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
.rank-btn b { font-size: 18px; }
.rank-btn span { font-size: 11px; color: var(--muted); }

.news { border: 0; width: 100%; text-align: left; background: var(--surface); border-radius: 14px; padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start; }
.tag { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.tag.up { background: var(--up-tint); }
.tag.down { background: var(--down-tint); }
.tag.gold { background: #2A2616; color: var(--gold); }
.tag.none { background: var(--surface-2); color: var(--soft); }
.div-card { gap: 10px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv b { font-weight: 600; text-align: right; }
.note { margin: 2px 0 0; font-size: 12px; line-height: 1.55; color: var(--muted); }
.fab { position: fixed; z-index: 6; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(66px + 16px + env(safe-area-inset-bottom, 0px)); width: 66px; height: 66px; border-radius: 50%; border: 0; padding: 4px; background: conic-gradient(var(--live) var(--p, 0deg), var(--surface-2) 0); box-shadow: 0 8px 22px rgba(0,0,0,.45); cursor: default; }
.fab-in { width: 100%; height: 100%; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.fab-t { font-size: 13px; font-weight: 600; color: var(--soft); }
.fab.ready { background: #1C7D51; cursor: pointer; padding: 0; }
.fab.ready .fab-in { background: #1C7D51; }
.fab.ready .fab-t { color: #FFFFFF; font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
@media (prefers-reduced-motion: no-preference) {
  .fab.ready { animation: ready 1.6s ease-in-out infinite; }
  .fab.ready:active { transform: scale(.94); }
}
@keyframes ready { 50% { box-shadow: 0 8px 22px rgba(0,0,0,.45), 0 0 0 7px rgba(61,214,140,.25); } }
.shop-fab { width: 58px; height: 58px; border-radius: 50%; background: #1C7D51; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.shop-list { display: flex; flex-direction: column; gap: 8px; }
.shop-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid transparent; min-height: 52px; }
.shop-row.now { border-color: #6B5A23; }
.shop-row.locked { background: transparent; border-color: var(--line); }
.shop-lv { width: 40px; font-weight: 700; color: var(--soft); flex-shrink: 0; }
.shop-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.shop-main b { font-size: 15px; font-weight: 600; }
.shop-main span { font-size: 12px; color: var(--muted); }
.shop-row.locked .shop-main b { color: var(--soft); }
.shop-price { font-size: 13px; color: var(--muted); flex-shrink: 0; }
.up-btn { border: 1px solid var(--live); background: transparent; color: var(--live); border-radius: 12px; padding: 7px 12px; min-height: 48px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.up-btn small { font-size: 11px; font-weight: 500; }
.up-btn:disabled { border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.auth { display: flex; flex-direction: column; gap: 18px; padding-top: 28px; }
.auth-brand { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.auth-brand .sub { margin: 0; }
.auth-mark { width: 60px; height: 60px; border-radius: 18px; background: var(--up-tint); color: var(--up); display: flex; align-items: center; justify-content: center; }
.auth-seg button.on { background: var(--surface-2); color: var(--fg); }
.auth-form { gap: 14px; }
.auth-in { height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; padding: 0 14px; outline: none; width: 100%; }
.auth-in:focus { border-color: var(--down); }
.auth-err { margin: 0; color: var(--up); font-size: 13px; }
body.busy button[data-action] { cursor: progress; }
.switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line); padding: 0; flex-shrink: 0; }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); transition: transform .15s ease, background .15s ease; }
.switch.on { background: #1C7D51; }
.switch.on i { transform: translateX(20px); background: #FFFFFF; }
.bgm-btn { position: fixed; z-index: 6; left: max(16px, calc(env(safe-area-inset-left, 0px) + 16px)); bottom: calc(66px + 16px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.bgm-btn .ic-on { display: none; }
.bgm-btn.on { color: var(--live); border-color: #1C7D51; }
.bgm-btn.on .ic-on { display: block; }
.bgm-btn.on .ic-off { display: none; }
@media (prefers-reduced-motion: no-preference) { .bgm-btn.on .ic-on { animation: bob 2.4s ease-in-out infinite; } }
@keyframes bob { 50% { transform: translateY(-2px); } }
.rank-seg button.on { background: var(--surface-2); color: var(--fg); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; }
.badges.big .badge { font-size: 12px; padding: 4px 9px; }
.past { display: flex; flex-direction: column; gap: 8px; }
.past-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface); font-size: 13px; }
.past-row > span { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--soft); }
.shelf { gap: 14px; }
.shelf-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.shelf-n { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 12px; background: var(--bg); }
.shelf-n b { font-size: 20px; color: var(--fg); }
.shelf-n span { font-size: 11px; color: var(--muted); }
.shelf-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.shelf-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 4px; border-radius: 12px; border: 1px solid; text-align: center; }
.shelf-item b { font-size: 13px; }
.shelf-item span { font-size: 11px; color: var(--soft); }
/* 맨 위 제목 줄은 스크롤해도 고정 */
.stick { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg);
  margin-top: -18px; padding-top: 14px; padding-bottom: 10px;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: 0 1px 0 var(--surface-2); }
.dhead.stick { margin-top: -18px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 10px; padding-bottom: 8px; }
.rank-head { display: flex; flex-direction: column; gap: 4px; }
.rank-head .sub { margin: 0; }
.bank-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.bank-tab { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 2px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.bank-tab b { font-size: 12px; font-weight: 600; color: var(--soft); white-space: nowrap; }
.bank-tab span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bank-tab.on { background: #2A2616; border-color: var(--gold); }
.bank-tab.on b { color: var(--gold); }
.bank-tab.on span { color: var(--fg); }
.bank-tab.warn span { color: var(--up); }
.asset-bar { position: relative; }
.loan-seg { position: absolute; top: 0; right: 0; bottom: 0; display: block; border-radius: 0 999px 999px 0;
  background: var(--up); box-shadow: -2px 0 0 var(--surface); }
.loan-sw { background: var(--up); flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nm { font-weight: 700; }
.me-chip { border: 0; width: 100%; text-align: left; background: var(--bg); border-radius: 12px; padding: 10px 12px; min-height: 44px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.me-chip b { font-size: 14px; }
.me-chip .t { font-size: 12px; color: var(--soft); }
.mini-xp { flex: 1; min-width: 48px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.mini-xp i, .xpbar i { display: block; height: 100%; border-radius: 999px; }
.xpbar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.pname { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.pname b { font-size: 19px; }
.ttag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid currentColor; }
.lvbadge { font-weight: 700; font-size: 15px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); flex-shrink: 0; }
.nick-row { display: flex; gap: 8px; padding-top: 4px; }
.nick-row input { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; padding: 0 12px; outline: none; }
.nick-row input:focus { border-color: var(--down); }
.title-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; min-height: 58px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; }
.tbtn b { font-size: 14px; }
.tbtn span { font-size: 11px; color: var(--muted); }
.tbtn.on { border-width: 2px; padding: 11px; }
.tbtn:disabled { cursor: not-allowed; background: transparent; }
.ach-list { display: flex; flex-direction: column; }
.ach { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--surface-2); }
.ach-ic { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ach.done .ach-ic { background: #1D3A2C; color: var(--live); }
.ach-t { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ach-t b { font-size: 14px; font-weight: 600; }
.ach-t span { font-size: 12px; color: var(--muted); }
.ach:not(.done) .ach-t b { color: var(--soft); }
.ach-bar { display: block; height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 5px; }
.ach-bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
.ach-xp { font-size: 12px; font-weight: 600; color: var(--soft); }
.ach.done .ach-xp { color: var(--live); }
.pod-t { font-size: 11px; color: var(--muted); }
.rrow .who { display: flex; flex-direction: column; gap: 1px; }
.rrow .who small { font-size: 11px; color: var(--muted); font-weight: 400; }
.product h2 { margin: 0; font-size: 16px; }
.product { gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.amt-box { display: flex; align-items: center; gap: 6px; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); cursor: text; }
.amt-box:focus-within { border-color: var(--gold); }
.amt-box input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 19px; font-weight: 700; text-align: right; outline: none; padding: 0; }
.amt-box span { color: var(--soft); }
.amt-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.amt-foot .pv { font-size: 12px; color: var(--soft); min-height: 1em; }
.amt-foot .chip { min-height: 30px; padding: 5px 10px; }
.terms { display: flex; gap: 6px; }
.chip.term { flex: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 50px; }
.chip.term b { font-size: 14px; }
.chip.term span { font-size: 11px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-gold, .btn-line { flex: 1; min-height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700; }
.btn-gold { border: 0; background: var(--gold); color: #1A1608; }
.btn-line { border: 1px solid var(--gold); background: transparent; color: var(--gold); }
.btn-gold.wide, .btn-line.wide { width: 100%; flex: none; }
.btn-loan { border: 0; min-height: 48px; border-radius: 12px; background: var(--up-btn); color: #FFFFFF; font-size: 15px; font-weight: 700; }
.btn-loan.wide { width: 100%; }
.btn-loan:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; font-weight: 500; }
.ghost:disabled { color: var(--muted); cursor: not-allowed; opacity: .6; }
.note.warn { color: var(--up); }
.ghost.small { min-height: 36px; padding: 6px 12px; align-self: flex-start; }
.acct { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.acct > .split b { font-size: 14px; }
.news-list { display: flex; flex-direction: column; gap: 8px; }
.link { border: 0; background: transparent; color: var(--down); font-size: 13px; font-weight: 600; padding: 8px 0; min-height: 36px; }
.news-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.news-text b { font-size: 14px; font-weight: 600; line-height: 1.4; }
.news-text span { font-size: 12px; color: var(--muted); }

.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.chips { display: flex; gap: 6px; }
.chip { border: 0; padding: 7px 11px; border-radius: 999px; background: var(--surface); color: var(--soft); font-size: 12px; min-height: 32px; }
.chip.on { background: var(--fg); color: var(--bg); font-weight: 600; }

.list { display: flex; flex-direction: column; margin: -4px -8px 0; }
.row { border: 0; background: transparent; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 12px; min-height: 60px; }
.row:hover { background: var(--surface); }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--soft); flex-shrink: 0; }
.row-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-main b { font-size: 15px; font-weight: 600; }
.row-main span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 84px; }
.row-end b { font-size: 15px; font-weight: 600; }
.row-end span { font-size: 12px; font-weight: 600; }
.spark { flex-shrink: 0; }
@media (prefers-reduced-motion: no-preference) {
  .flash-up { animation: fu .8s ease-out; } .flash-down { animation: fd .8s ease-out; }
}
@keyframes fu { from { background: var(--up-tint); } }
@keyframes fd { from { background: var(--down-tint); } }
.limit { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); line-height: 1.6; background: var(--surface); border-radius: 14px; }

/* detail */
.dhead { display: flex; align-items: center; gap: 4px; margin: -6px -10px 0; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
.dtitle { flex: 1; display: flex; flex-direction: column; }
.dtitle b { font-size: 17px; }
.dtitle span { font-size: 12px; color: var(--muted); }
.price-big { font-size: 31px; font-weight: 700; letter-spacing: -0.6px; }
.chart-wrap { margin: 0 -6px; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.period { display: flex; gap: 6px; }
.period .chip { flex: 1; border-radius: 10px; min-height: 36px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }

.stats span { font-size: 12px; color: var(--muted); }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 440px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 16px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 13px; box-shadow: 0 -12px 32px rgba(0,0,0,.35); }
.seg { display: flex; padding: 4px; border-radius: 12px; background: var(--bg); }

.seg .buy.on { background: var(--up-btn); color: #FFFFFF; }
.seg .sell.on { background: var(--down-btn); color: #FFFFFF; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--line); font-size: 20px; }
.qty-box { display: flex; align-items: center; gap: 4px; width: 104px; height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); cursor: text; }
.qty-box:focus-within { border-color: var(--down); }
.qty-box input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 20px; font-weight: 700; text-align: right; outline: none; padding: 0; }
.qty-box span { font-size: 14px; color: var(--soft); }
.warn { color: var(--up); }
.stepper .max { width: auto; padding: 0 12px; font-size: 13px; font-weight: 600; }
.sum { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.cta { min-height: 54px; border: 0; border-radius: 14px; color: #FFFFFF; font-size: 17px; font-weight: 700; }
.cta.buy { background: var(--up-btn); } .cta.sell { background: var(--down-btn); }
.cta:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

/* portfolio */
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--line); }
.bar i { display: block; background: var(--down); }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--soft); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 6px; }
.sw { width: 8px; height: 8px; border-radius: 2px; }
.trades { display: flex; flex-direction: column; gap: 10px; }
.trade { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.trade .what { flex: 1; min-width: 0; }
.trade .when { color: var(--muted); }
.reset { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding-top: 6px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 12px; padding: 10px 14px; color: var(--soft); font-size: 13px; min-height: 44px; }
.danger { border: 0; background: var(--up-btn); color: #FFFFFF; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; min-height: 44px; }

/* ranking */
.sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.pod { background: var(--surface); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 1px solid transparent; }
.pod.first { padding-block: 20px; background: #2A2616; border-color: #6B5A23; }
.pod.me { border-color: #3D5A92; }
.pod b { font-size: 14px; font-weight: 600; word-break: keep-all; }
.pod .r { font-size: 13px; font-weight: 700; }
.pod .r1 { color: var(--gold); } .pod .r2 { color: #C9D2E3; } .pod .r3 { color: #E0A57A; }
.pod small { font-size: 12px; font-weight: 600; }
.rrow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid transparent; }
.rrow.me { background: var(--down-tint); border-color: #3D5A92; }
.rrow .n { width: 22px; text-align: center; font-weight: 700; color: var(--soft); }
.rrow .who { flex: 1; font-size: 15px; min-width: 0; }
.rrow.me .who { font-weight: 700; }
.rrow .end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.rrow .end b { font-size: 14px; font-weight: 600; }
.rrow .end span { font-size: 12px; font-weight: 600; }

/* nav + toast */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--surface-2); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-in { max-width: 440px; margin: 0 auto; display: flex; height: 66px; }
.nav button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11px; }
.nav button.on { color: var(--fg); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(156px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.detail-mode ~ .toast { bottom: calc(290px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>

<main class="app" id="app"></main>
<div class="sheet" id="sheet" hidden></div>
<nav class="nav" id="nav" aria-label="하단 메뉴">
  <div class="nav-in">

    <button data-action="nav" data-view="shop" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"></path><path d="M5 13v7h14v-7"></path><path d="M10 20v-4h4v4"></path></svg>

    </button>
    <button data-action="nav" data-view="portfolio" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18"></path><path d="M16 15h2"></path></svg>
      <span>내 자산</span>
    </button>
    <button data-action="nav" data-view="ranking" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4a3 3 0 0 0 3 4"></path><path d="M17 6h3a3 3 0 0 1-3 4"></path></svg>
      <span>랭킹</span>
    </button>
  </div>

<button class="fab" id="fab" data-action="work-claim" type="button" aria-label="돈벌기"><span class="fab-in"><span class="fab-t num" id="fab-t">돈벌기</span></span></button>
<audio id="bgm" src="bgm.mp3?v=2" loop preload="none"></audio>
<button class="bgm-btn" id="bgm-btn" type="button" aria-pressed="false" aria-label="배경 음악 켜기">
  <svg class="ic-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
  <svg class="ic-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle><path d="M3 3l18 18"></path></svg>
</button>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var TICK_MS = 60000, DAY_TICKS = 120, START_CASH = 1000000, HIST_MAX = 360, SAVE_KEY = 'ant-exchange-v1';
  // 배당률: 게임 속 하루(120틱)가 끝날 때 1회 지급되는 비율(%)
  var DIV = { HBE: 1.5, CRS: 0.3, PRB: 0, BYE: 0.8, DRH: 2.2, BDS: 2.5, GRE: 2.0, GRS: 0.5 };
  var GOOD = ['{n}, 신제품 공개… 매수세 몰려', '{n}, 대형 수주 계약 체결', '{n}, 분기 실적 예상치 상회', '{n}, 해외 시장 진출 발표', '외국인, {n} 대량 순매수', '{n}, 자사주 매입 결정'];
  var BAD = ['{n}, 주요 임원 사임 소식', '{n}, 실적 부진 우려 확산', '{n}, 공장 가동 일시 중단', '경쟁사 신제품에 {n} 점유율 위기', '{n}, 대규모 유상증자 발표', '{n} 제품 리콜 결정'];

  var state, ui = { view: 'market', sel: null, side: 'buy', qty: 1, sort: 'chg', period: 'day', confirmReset: false };
  var nextAt = 0, toastTimer = null;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function gauss() { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function unit(p) { if (p < 2000) return 1; if (p < 5000) return 5; if (p < 20000) return 10; if (p < 50000) return 50; if (p < 200000) return 100; if (p < 500000) return 500; return 1000; }
  function roundTick(p) { var u = unit(p); return Math.round(p / u) * u; }
  function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
  function signed(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)); }
  function pct(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2) + '%'; }
  function cls(n) { return n > 0 ? 'up' : n < 0 ? 'down' : 'flat'; }
  function stock(code) { for (var i = 0; i < state.stocks.length; i++) if (state.stocks[i].code === code) return state.stocks[i]; return null; }
  function day() { return Math.floor(state.tick / DAY_TICKS) + 1; }
  function dayStartTick() { return (day() - 1) * DAY_TICKS; }




  function holdValue(hold) {
    var v = 0; for (var c in hold) { var s = stock(c); if (s) v += s.price * (typeof hold[c] === 'number' ? hold[c] : hold[c].qty); } return v;
  }
  function grossAssets() { return state.cash + holdValue(state.hold) + bankPrincipal(); }
  function myTotal() { return grossAssets() - (state.bank.loan || 0); }

  function dps(s) { return Math.floor(s.price * rate(s) / 100 / 5) * 5; }
  function untilPayout() {
    var min = (DAY_TICKS - (state.tick % DAY_TICKS)) * TICK_MS / 60000;
    var h = Math.floor(min / 60), m = Math.round(min % 60);
    return (h ? h + '시간 ' : '') + m + '분';
  }
  function expectedDiv() {
    var t = 0; for (var c in state.hold) { var s = stock(c); if (s) t += dps(s) * state.hold[c].qty; } return t;
  }


  // ---------- bank ----------
  var SAV_RATE = 0.1, EARLY_RATE = 0.1;            // 하루(게임) 기준 %
  var DEP_TERMS = { 3: 0.2, 6: 0.25, 12: 0.3 };    // 정기 예금: 기간(일) → 하루 이율 %
  var PLAN_TERMS = { 6: 0.35, 12: 0.4 };          // 적금: 기간(일) → 하루 이율 %
  var DEP_MIN = 100000, PLAN_MIN = 10000;
  var VAULT0 = 100000000, LOAN_RATE = 0.5, LOAN_LTV = 0.5, LOAN_MIN = 100000;   // 대출: 하루 0.5%, 순자산의 50%까지

  function loanLimit() { return Math.max(0, Math.floor(myTotal() * LOAN_LTV)); }
  function loanAvail() { return Math.max(0, Math.floor(Math.min(loanLimit() - state.bank.loan, state.bank.vault) / 1000) * 1000); }
  function loanInterestDue() { return Math.ceil(state.bank.loan * LOAN_RATE / 100); }


  function planPaid(p) { return p.paid.reduce(function (a, x) { return a + x.amt; }, 0); }
  function bankPrincipal() {
    var b = state.bank, t = b.sav;
    b.deps.forEach(function (d) { t += d.amt; });
    b.plans.forEach(function (p) { t += planPaid(p); });
    return t;
  }
  function boundaryAfter(t, days) { return (Math.floor(t / DAY_TICKS) + days) * DAY_TICKS; }
  function depInterest(d) { return Math.floor(d.amt * d.rate / 100 * d.term); }
  function planInterest(p) {
    return p.paid.reduce(function (a, x) { return a + Math.floor(x.amt * p.rate / 100 * Math.max(1, Math.round((p.end - x.tick) / DAY_TICKS))); }, 0);
  }
  function planProjected(p) {
    var total = planPaid(p) + planInterest(p);
    for (var t = boundaryAfter(state.tick, 1); t < p.end; t += DAY_TICKS) total += p.amt + Math.floor(p.amt * p.rate / 100 * ((p.end - t) / DAY_TICKS));
    return total;
  }
  function earlyPayout(item) {
    var parts = item.paid ? item.paid : [{ tick: item.start, amt: item.amt }];
    return parts.reduce(function (a, x) { return a + x.amt + Math.floor(x.amt * EARLY_RATE / 100 * Math.floor((state.tick - x.tick) / DAY_TICKS)); }, 0);
  }




  function ago(t) {
    var sec = (state.tick - t) * TICK_MS / 1000;
    if (sec < 60) return '방금';
    if (sec < 3600) return Math.floor(sec / 60) + '분 전';
    if (sec < 86400) return Math.floor(sec / 3600) + '시간 전';
    return Math.floor(sec / 86400) + '일 전';
  }

  function newsItem(n, clickable) {
    var s = stock(n.code), since = n.p ? (s.price / n.p - 1) * 100 : null;
    var inner = '<span class="tag ' + (n.up ? 'up' : 'down') + '">' + (n.up ? '호재' : '악재') + '</span>' +
      '<span class="news-text"><b>' + n.text + '</b><span>' + s.name + ' · Day ' + (Math.floor(n.tick / DAY_TICKS) + 1) + ' · ' + ago(n.tick) +
      (since !== null ? ' · 뉴스 이후 <span class="num ' + cls(since) + '">' + pct(since) + '</span>' : '') + '</span></span>';
    return clickable
      ? '<button class="news" data-action="open" data-code="' + n.code + '" type="button">' + inner + '</button>'
      : '<div class="news">' + inner + '</div>';
  }

  function viewNews() {
    var f = ui.newsFilter || 'all', fs = stock(f);
    var list = state.news.filter(function (n) {
      if (f === 'good') return n.up;
      if (f === 'bad') return !n.up;
      if (f === 'mine') return !!state.hold[n.code];
      if (fs) return n.code === f;
      return true;
    });
    var html = '<header class="topbar stick"><h1 class="brand">뉴스</h1><span class="pill"><span class="dot"></span><span>Day ' + day() + ' · <b class="num" id="cd">60</b>초</span></span></header>' +
      '<div class="chips" role="group" aria-label="뉴스 필터" style="flex-wrap:wrap">' +
      chip('newsf', 'all', '전체', f) + chip('newsf', 'good', '호재', f) + chip('newsf', 'bad', '악재', f) + chip('newsf', 'mine', '보유 종목', f) +
      (fs ? chip('newsf', f, fs.name, f) : '') + '</div>' +
      '<p class="sub" style="margin:0">' + (list.length ? '최근 ' + list.length + '건 · 누르면 종목으로 이동해요' : '') + '</p>';
    if (!list.length) {
      html += '<div class="empty">' + (state.news.length ? '조건에 맞는 뉴스가 없어요.' : '아직 나온 뉴스가 없어요.<br>시세가 바뀔 때마다 7% 확률로 속보가 나와요.') + '</div>';
    } else {
      html += '<div class="news-list">' + list.map(function (n) { return newsItem(n, true); }).join('') + '</div>';
    }
    return html;
  }

  function sparkPath(h, w, ht) {
    var pts = h.slice(-30), mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), rg = mx - mn || 1;
    return pts.map(function (p, i) { return (i ? 'L' : 'M') + (2 + i * (w - 4) / Math.max(1, pts.length - 1)).toFixed(1) + ' ' + (ht - 3 - (p - mn) / rg * (ht - 6)).toFixed(1); }).join(' ');
  }

  // ---------- level ----------
  var MAX_LV = 30, ACT_CAP = 30;
  var TITLES = [
    { lv: 1, name: '주린이', color: '#B8C1D3' },
    { lv: 5, name: '개미 투자자', color: '#3DD68C' },
    { lv: 10, name: '단골 트레이더', color: '#4FD1C5' },
    { lv: 15, name: '차트 장인', color: '#7FB2FF' },
    { lv: 20, name: '큰손', color: '#B892FF' },
    { lv: 25, name: '슈퍼개미', color: '#FF9F5A' },
    { lv: 30, name: '전설의 개미', color: '#F2C94C' }
  ];
  var ACH = [
    { id: 'buy1', name: '첫 매수', desc: '주식을 처음 샀어요', xp: 10 },
    { id: 'win1', name: '첫 수익 실현', desc: '이익을 보고 팔았어요', xp: 15 },
    { id: 'div1', name: '첫 배당', desc: '배당금을 처음 받았어요', xp: 10 },
    { id: 'bank1', name: '첫 저축', desc: '정기 예금이나 적금에 처음 가입했어요', xp: 10 },
    { id: 'big', name: '한 방', desc: '30만 원 이상 매도로 +15% 이상 수익 실현', xp: 40 },
    { id: 'plan', name: '성실 납입', desc: '미납 없이 적금 만기 달성', xp: 40 },
    { id: 'top3', name: '시상대', desc: '시즌 랭킹 3위 안에 들기', xp: 50 },
    { id: 'rich', name: '2천만 원 돌파', desc: '총자산 2,000만 원 달성', xp: 60 }
  ];
  // 은행 업적: 받은 이자 누적 기준, 보상금은 은행 자금과 별개로 추가 지급 (서버 check_bank_ach 와 같은 값)
  var BANK_ACH = [
    { id: 'int1', name: '첫 이자', need: 1000, reward: 100000, xp: 10 },
    { id: 'int2', name: '저축 새싹', need: 10000, reward: 500000, xp: 20 },
    { id: 'int3', name: '저축왕', need: 100000, reward: 3000000, xp: 40 },
    { id: 'int4', name: '이자 부자', need: 1000000, reward: 20000000, xp: 60 },
    { id: 'int5', name: '은행의 큰손', need: 10000000, reward: 100000000, xp: 100 }
  ];
  var pendingMsgs = [];
  function xpNeed(n) { return 20 + 15 * (n - 1); }
  function lvInfo(xp) {
    var lv = 1, rest = xp;
    while (lv < MAX_LV && rest >= xpNeed(lv)) { rest -= xpNeed(lv); lv++; }
    return { lv: lv, cur: rest, next: lv < MAX_LV ? xpNeed(lv) : 0 };
  }
  function titleFor(lv) { var t = TITLES[0]; TITLES.forEach(function (x) { if (lv >= x.lv) t = x; }); return t; }
  function myLv() { return lvInfo(state.prof.xp).lv; }
  function myTitle() { var e = state.prof.equip; return (e != null && TITLES[e] && TITLES[e].lv <= myLv()) ? TITLES[e] : titleFor(myLv()); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameHtml(name, t) { return '<span class="nm" style="color:' + t.color + '">' + esc(name) + '</span>'; }

  function flushMsgs() { while (pendingMsgs.length) toast(pendingMsgs.shift()); }

  function meChip() {
    var info = lvInfo(state.prof.xp), t = myTitle(), w = info.next ? info.cur / info.next * 100 : 100;
    return '<button class="me-chip" data-action="nav" data-view="profile" type="button" aria-label="내 레벨과 칭호 보기">' +
      '<b>' + nameHtml(state.prof.nick, t) + '</b><span class="t">Lv.' + info.lv + ' · ' + t.name + '</span>' +
      '<span class="mini-xp" aria-hidden="true"><i style="width:' + w.toFixed(1) + '%;background:' + t.color + '"></i></span>' +

  function chg(s) { return s.price - s.base; }

    var e = Math.floor(n / 1e8), m = Math.round((n % 1e8) / 1e4);

  }
  function krwX(n) { return n % 10000 ? fmt(n) + '원' : krw(n); }
  function payRange(j) { return krwX(j.min) + ' ~ ' + krwX(j.max); }
  function workLeft() { return Math.max(0, WORK_CD - (Date.now() - state.work.last)); }

      chip('sort', 'chg', '상승률', ui.sort) + chip('sort', 'price', '가격', ui.sort) + chip('sort', 'div', '배당', ui.sort) + chip('sort', 'mine', '보유', ui.sort) + '</div></div>';
    if (!list.length) html += '<div class="empty">아직 보유한 종목이 없어요.<br>마음에 드는 종목을 눌러 매수해보세요.</div>';
    else {
      html += '<div class="list">';
      list.forEach(function (s) {
        var c = chg(s), dir = s.price > s.prev ? 'flash-up' : s.price < s.prev ? 'flash-down' : '';
        var col = c >= 0 ? 'var(--up)' : 'var(--down)';
        html += '<button class="row' + (flash && dir ? ' ' + dir : '') + '" data-action="open" data-code="' + s.code + '" type="button">' +
          logo(s) +
          '<span class="row-main"><b>' + s.name + limitTag(s) + '</b><span>' + (state.hold[s.code] ? state.hold[s.code].qty + '주 보유 · ' : '') + (ui.sort === 'div' ? (rate(s) ? '배당 ' + rate(s).toFixed(1) + '% · 1주 ' + fmt(dps(s)) + '원' : '무배당') : s.sector + (rate(s) >= 2 ? ' · 고배당' : '')) + '</span></span>' +
          '<svg class="spark" width="60" height="26" viewBox="0 0 60 26" aria-hidden="true"><path d="' + sparkPath(s.hist, 60, 26) + '" fill="none" stroke="' + col + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
          '<span class="row-end"><b class="num">' + fmt(s.price) + '</b><span class="num ' + cls(c) + '">' + pct(chgPct(s)) + '</span></span></button>';
      });
      html += '</div>';
    }
    return html;
  }

  function chip(action, key, label, cur) {
    return '<button class="chip' + (key === cur ? ' on' : '') + '" data-action="' + action + '" data-key="' + key + '" type="button" aria-pressed="' + (key === cur) + '">' + label + '</button>';
  }

  // 최근 30분을 1분봉 캔들로 (양봉 빨강, 음봉 파랑)
  var CANDLE_TICKS = 1, CANDLE_COUNT = 30;
  function candleSvg(s) {
    var h = s.hist, n = h.length, span = CANDLE_TICKS * CANDLE_COUNT;
    function priceAt(t) { var i = n - 1 - (state.tick - t); return i >= 0 && i < n ? h[i] : null; }
    var firstGroup = Math.floor((state.tick - span + 1) / CANDLE_TICKS);
    var lastGroup = Math.floor(state.tick / CANDLE_TICKS), candles = [];
    for (var g = Math.max(firstGroup, lastGroup - CANDLE_COUNT + 1); g <= lastGroup; g++) {
      var ps = [];
      for (var t = g * CANDLE_TICKS; t < (g + 1) * CANDLE_TICKS && t <= state.tick; t++) { var v = priceAt(t); if (v != null) ps.push(v); }
      if (!ps.length) continue;
      var prevClose = priceAt(g * CANDLE_TICKS - 1);
      var o = prevClose != null ? prevClose : ps[0], c = ps[ps.length - 1];
      candles.push({ o: o, c: c, h: Math.max.apply(null, ps.concat([o])), l: Math.min.apply(null, ps.concat([o])), live: g === lastGroup });
    }
    if (!candles.length) candles.push({ o: s.prev, c: s.price, h: Math.max(s.prev, s.price), l: Math.min(s.prev, s.price), live: true });
    var W = 360, H = 190, L = 6, R = 62, T = 14, B = 22;
    var mx = Math.max.apply(null, candles.map(function (k) { return k.h; })), mn = Math.min.apply(null, candles.map(function (k) { return k.l; }));
    var pad = (mx - mn) * 0.08 || mx * 0.01; var top = mx + pad, bot = mn - pad;
    function y(p) { return T + (top - p) / (top - bot) * (H - T - B); }
    var slot = (W - L - R) / CANDLE_COUNT, bw = Math.max(3, slot * 0.62);
    var off = CANDLE_COUNT - candles.length;
    var grid = '';
    for (var gi = 0; gi < 4; gi++) { var gy = T + gi * (H - T - B) / 3; grid += '<line x1="' + L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + gy.toFixed(1) + '" stroke="var(--surface-2)" stroke-width="1"></line>'; }
    var avgBody = candles.reduce(function (a, k) { return a + Math.abs(k.c - k.o); }, 0) / candles.length || 1;
    var body = '';
    candles.forEach(function (k, i) {
      var cx = L + (off + i + 0.5) * slot, up = k.c >= k.o, col = up ? 'var(--up)' : 'var(--down)';
      var yt = y(Math.max(k.o, k.c)), yb = y(Math.min(k.o, k.c)), bh = Math.max(1.5, yb - yt);
      body += '<line x1="' + cx.toFixed(1) + '" y1="' + y(k.h).toFixed(1) + '" x2="' + cx.toFixed(1) + '" y2="' + y(k.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1.3"></line>' +
        '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + yt.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1" fill="' + col + '"' + (k.live ? ' fill-opacity="0.7"' : '') + '></rect>';
      if (up && k.c - k.o >= avgBody * 2.2 && k.c > k.o) body += '<text x="' + cx.toFixed(1) + '" y="' + (y(k.h) - 5).toFixed(1) + '" fill="var(--up)" font-size="9" font-weight="700" text-anchor="middle" font-family="inherit">장대</text>';
    });
    var last = candles[candles.length - 1].c, ly = y(last);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + s.name + ' 최근 30분 1분봉 차트">' + grid + body +
      '<line x1="' + L + '" y1="' + ly.toFixed(1) + '" x2="' + (W - R) + '" y2="' + ly.toFixed(1) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4"></line>' +
      '<text x="' + (W - R + 8) + '" y="' + (y(mx) + 4).toFixed(1) + '" fill="var(--soft)" font-size="11" font-family="inherit">' + fmt(mx) + '</text>' +
      '<text x="' + (W - R + 8) + '" y="' + (y(mn) + 4).toFixed(1) + '" fill="var(--soft)" font-size="11" font-family="inherit">' + fmt(mn) + '</text>' +
      (Math.abs(ly - y(mx)) > 14 && Math.abs(ly - y(mn)) > 14 ? '<text x="' + (W - R + 8) + '" y="' + (ly + 4).toFixed(1) + '" fill="var(--fg)" font-size="11" font-weight="600" font-family="inherit">' + fmt(last) + '</text>' : '') +
      '<text x="' + L + '" y="' + (H - 6) + '" fill="var(--muted)" font-size="10" font-family="inherit">' + ago(state.tick - candles.length * CANDLE_TICKS + 1) + ' · 1분봉</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 6) + '" fill="var(--muted)" font-size="10" font-family="inherit" text-anchor="end">지금</text></svg>';
    return svg;
  }

  function chartSvg(s) {
    if (ui.period === 'recent') return candleSvg(s);
    var pts;
    if (ui.period === 'recent') pts = s.hist.slice(-30);
    else if (ui.period === 'day') pts = s.hist.slice(-Math.max(2, state.tick - dayStartTick() + 1));
    else pts = s.hist.slice();
    if (pts.length < 2) pts = [s.prev, s.price];
    var W = 360, H = 190, L = 6, R = 62, T = 14, B = 22;
    var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts);
    if (ui.period === 'day') { mn = Math.min(mn, s.base); mx = Math.max(mx, s.base); }
    var pad = (mx - mn) * 0.08 || mx * 0.01; mn -= pad; mx += pad;
    function x(i) { return L + i * (W - L - R) / (pts.length - 1); }
    function y(p) { return T + (mx - p) / (mx - mn) * (H - T - B); }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p).toFixed(1); }).join(' ');
    var area = line + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + L + ' ' + (H - B) + ' Z';
    var refP = ui.period === 'day' ? s.base : pts[0];
    var col = pts[pts.length - 1] >= refP ? 'var(--up)' : 'var(--down)';
    var hi = Math.max.apply(null, pts), lo = Math.min.apply(null, pts);
    var grid = '';
    for (var g = 0; g < 4; g++) { var gy = T + g * (H - T - B) / 3; grid += '<line x1="' + L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + gy.toFixed(1) + '" stroke="var(--surface-2)" stroke-width="1"></line>'; }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + s.name + ' 주가 차트">' + grid;
    if (ui.period === 'day') svg += '<line x1="' + L + '" y1="' + y(s.base).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(s.base).toFixed(1) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4"></line>';
    svg += '<path d="' + area + '" fill="' + col + '" fill-opacity="0.12"></path>' +
      '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>' +
      '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(pts[pts.length - 1]).toFixed(1) + '" r="4" fill="' + col + '"></circle>' +
      '<text x="' + (W - R + 8) + '" y="' + (y(hi) + 4).toFixed(1) + '" fill="var(--soft)" font-size="11" font-family="inherit">' + fmt(hi) + '</text>' +
      '<text x="' + (W - R + 8) + '" y="' + (y(lo) + 4).toFixed(1) + '" fill="var(--soft)" font-size="11" font-family="inherit">' + fmt(lo) + '</text>';
    if (ui.period === 'day') svg += '<text x="' + (W - R + 8) + '" y="' + (y(s.base) + 4).toFixed(1) + '" fill="var(--muted)" font-size="10" font-family="inherit">기준</text>';
    svg += '<text x="' + L + '" y="' + (H - 6) + '" fill="var(--muted)" font-size="10" font-family="inherit">' + ago(state.tick - pts.length + 1) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 6) + '" fill="var(--muted)" font-size="10" font-family="inherit" text-anchor="end">지금</text></svg>';
    return svg;
  }

  function viewDetail() {
    var s = stock(ui.sel); if (!s) { ui.view = 'market'; return viewMarket(); }
    var c = chg(s), h = state.hold[s.code];
    var sns = state.news.filter(function (n) { return n.code === s.code; });
    var html = '<header class="dhead stick"><button class="icon-btn" data-action="back" type="button" aria-label="시세판으로 돌아가기">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>' +
      logo(s, 36) + '<div class="dtitle" style="margin-left:8px"><b>' + s.name + '</b><span>' + s.sector + ' · 호가 단위 ' + fmt(unit(s.price)) + '원</span></div>' +
      '<span class="pill"><span class="dot"></span><span><b class="num" id="cd">5</b>초</span></span></header>' +
      '<div style="display:flex;flex-direction:column;gap:2px"><span class="price-big num">' + fmt(s.price) + '원' + limitTag(s) + '</span>' +
      '<span class="num ' + cls(c) + '" style="font-size:14px;font-weight:600">' + (c > 0 ? '▲ ' : c < 0 ? '▼ ' : '') + fmt(Math.abs(c)) + ' (' + pct(chgPct(s)) + ') · 오늘</span></div>' +
      '<div class="chart-wrap">' + chartSvg(s) + '</div>' +
      '<div class="period" role="group" aria-label="차트 기간">' + chip('period', 'recent', '최근 30분', ui.period) + chip('period', 'day', '오늘', ui.period) + chip('period', 'all', '전체', ui.period) + '</div>';
    html += '<div class="sec-head"><h2>' + s.name + ' 뉴스</h2>' + (sns.length > 3 ? '<button class="link" data-action="nav" data-view="news" data-key="' + s.code + '" type="button">전체 ' + sns.length + '건</button>' : '') + '</div>';
    if (sns.length) html += '<div class="news-list">' + sns.slice(0, 3).map(function (n) { return newsItem(n, false); }).join('') + '</div>';
    else html += '<div class="empty" style="padding:18px 16px">아직 이 종목 뉴스가 없어요.</div>';
    if (h) {
      var avg = h.cost / h.qty, r = (s.price / avg - 1) * 100;
      html += '<div class="stats"><div><span>보유</span><b>' + h.qty + '주</b></div><div><span>평균 단가</span><b class="num">' + fmt(avg) + '</b></div><div><span>수익률</span><b class="num ' + cls(r) + '">' + pct(r) + '</b></div></div>';
    } else {
      html += '<div class="stats"><div><span>오늘 기준가</span><b class="num">' + fmt(s.base) + '</b></div><div><span>상한가</span><b class="num up">' + fmt(roundTick(s.base * 1.3)) + '</b></div><div><span>하한가</span><b class="num down">' + fmt(roundTick(s.base * 0.7)) + '</b></div></div>';
    }
    var d = dps(s);
    html += '<section class="card div-card" aria-label="배당"><div class="split"><h2 style="margin:0;font-size:16px">배당</h2>' +
      '<span class="tag ' + (rate(s) ? 'gold' : 'none') + '">' + (rate(s) ? '배당률 ' + rate(s).toFixed(1) + '%' : '무배당') + '</span></div>';
    if (rate(s)) {
      html += '<div class="kv"><span class="label">1주당 예상 배당</span><b class="num">' + fmt(d) + '원</b></div>' +
        '<div class="kv"><span class="label">내 예상 배당</span><b class="num">' + (h ? fmt(d * h.qty) + '원 (' + h.qty + '주)' : '보유하면 받아요') + '</b></div>' +
        '<div class="kv"><span class="label">다음 지급</span><b class="num">' + untilPayout() + ' 후 · Day ' + day() + ' 마감</b></div>' +
        '<p class="note">지급 직후 주가가 1주당 배당금만큼 빠져요(배당락). 이후 서서히 회복해요.</p>';
    } else {
      html += '<p class="note">성장에 돈을 다시 쓰는 회사라 배당을 주지 않아요. 대신 주가 변동이 큰 편이에요.</p>';
    }
    html += '</section>';
    return html;
  }

  // 거래세: 매수 0.1%, 매도 0.2% (1원 미만 올림) → 은행으로
  var TAX_BUY = 0.001, TAX_SELL = 0.002;
  function taxOf(amt, side) { return Math.ceil(amt * (side === 'buy' ? TAX_BUY : TAX_SELL) - 1e-9); }
  function maxQty(s) {
    if (ui.side !== 'buy') return state.hold[s.code] ? state.hold[s.code].qty : 0;
    var q = Math.floor(state.cash / (s.price * (1 + TAX_BUY)));
    while (q > 0 && s.price * q + taxOf(s.price * q, 'buy') > state.cash) q--;
    return q;
  }

  function sheetParts(s) {
    var mx = maxQty(s), buy = ui.side === 'buy', q = ui.qty;
    var label, ok = false;
    if (mx < 1) label = buy ? '현금이 부족해요' : '보유한 주식이 없어요';
    else if (q < 1) label = '수량을 입력해주세요';
    else if (q > mx) label = (buy ? '현금이 부족해요' : '보유 수량보다 많아요') + ' · 최대 ' + fmt(mx) + '주';
    else { label = fmt(q) + '주 ' + (buy ? '매수하기' : '매도하기'); ok = true; }
    var amtN = s.price * Math.max(q, 0), taxN = taxOf(amtN, ui.side);
    return { mx: mx, ok: ok, label: label, over: q > mx,
      amt: fmt(amtN) + '원', tax: fmt(taxN) + '원', total: fmt(buy ? amtN + taxN : amtN - taxN) + '원',
      avail: buy ? fmt(state.cash) + '원 · 최대 ' + fmt(mx) + '주' : fmt(mx) + '주' };
  }

  function updateSheet() {
    var s = stock(ui.sel); if (!s) return;
    var p = sheetParts(s);
    var a = document.getElementById('sum-amt'), v = document.getElementById('sum-avail'), c = document.getElementById('cta');
    if (a) { a.textContent = p.amt; }
    var tx = document.getElementById('sum-tax'), tt = document.getElementById('sum-total');
    if (tx) tx.textContent = p.tax;
    if (tt) { tt.textContent = p.total; tt.classList.toggle('warn', p.over); }
    if (v) v.textContent = p.avail;
    if (c) { c.textContent = p.label; c.disabled = !p.ok; }
  }

  function renderSheet() {
    var sheet = document.getElementById('sheet');
    if (ui.view !== 'detail') { sheet.hidden = true; sheet.innerHTML = ''; return; }
    var inp = document.getElementById('qty-input');
    if (inp && document.activeElement === inp && !sheet.hidden) { updateSheet(); return; }
    var s = stock(ui.sel), p = sheetParts(s);
    var buy = ui.side === 'buy';
    sheet.hidden = false;
    sheet.innerHTML = '<section class="sheet-in" aria-label="주문">' +
      '<div class="seg" role="group" aria-label="주문 종류"><button class="buy' + (buy ? ' on' : '') + '" data-action="side" data-key="buy" type="button" aria-pressed="' + buy + '">매수</button>' +
      '<button class="sell' + (!buy ? ' on' : '') + '" data-action="side" data-key="sell" type="button" aria-pressed="' + !buy + '">매도</button></div>' +
      '<div class="split"><span style="color:var(--soft)">수량</span><div class="stepper">' +
      '<button data-action="qty" data-key="-1" type="button" aria-label="수량 줄이기">−</button>' +
      '<label class="qty-box"><input id="qty-input" class="num" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" aria-label="주문 수량" value="' + (ui.qty > 0 ? ui.qty : '') + '" placeholder="0"><span>주</span></label>' +
      '<button data-action="qty" data-key="1" type="button" aria-label="수량 늘리기">+</button>' +
      '<button class="max" data-action="max" type="button">최대</button></div></div>' +
      '<div class="sum"><div class="split"><span class="label">주문 금액</span><span class="num" id="sum-amt">' + p.amt + '</span></div>' +
      '<div class="split"><span class="label">거래세 (' + (buy ? '매수 0.1%' : '매도 0.2%') + ' · 은행으로)</span><span class="num" id="sum-tax">' + p.tax + '</span></div>' +
      '<div class="split"><span class="label">' + (buy ? '총 결제 금액' : '받을 금액') + '</span><b class="num' + (p.over ? ' warn' : '') + '" id="sum-total">' + p.total + '</b></div>' +
      '<div class="split"><span class="label">' + (buy ? '주문 가능 현금' : '매도 가능 수량') + '</span><span class="num" id="sum-avail">' + p.avail + '</span></div></div>' +
      '<button class="cta ' + ui.side + '" id="cta" data-action="order" type="button"' + (p.ok ? '' : ' disabled') + '>' + p.label + '</button></section>';
  }

  document.addEventListener('input', function (e) {
    var f = e.target.dataset && e.target.dataset.field;
    if (f) {
      var dg = e.target.value.replace(/[^0-9]/g, '').replace(/^0+/, '').slice(0, 10);
      if (e.target.value !== dg) e.target.value = dg;
      ui.bk[f] = dg ? parseInt(dg, 10) : 0;
      var pv = document.getElementById('bk-' + f + '-pv'); if (pv) pv.textContent = ui.bk[f] ? fmt(ui.bk[f]) + '원' : '';
      return;
    }
    if (e.target.id !== 'qty-input') return;
    var digits = e.target.value.replace(/[^0-9]/g, '').replace(/^0+/, '').slice(0, 7);
    if (e.target.value !== digits) e.target.value = digits;
    ui.qty = digits ? parseInt(digits, 10) : 0;
    updateSheet();
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'qty-input') return;
    if (ui.qty < 1) { ui.qty = 1; e.target.value = '1'; updateSheet(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'qty-input' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    if (e.target.id === 'nick-input' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveNick(); }
  });

  function mySeasonLine() {
    var me = seasonRankings().filter(function (x) { return x.me; })[0];
    if (!me || !state.season) return '';
    return '<span class="num ' + cls(me.ret) + '" style="font-size:13px;font-weight:600">' + esc(state.season.name) + ' ' + pct(me.ret) + ' · ' + me.rank + '위</span>';
  }

  function viewPortfolio() {
    var total = myTotal(), stockV = holdValue(state.hold), ret = (total / START_CASH - 1) * 100;
    var gross = stockV + bankPrincipal() + state.cash;
    var barTotal = gross + (state.bank.loan || 0);   // 막대 전체 = 가진 돈 전부 + 대출 (주식 · 은행 · 현금 · 대출)
    var cost = 0; for (var c in state.hold) cost += state.hold[c].cost;
    var pnl = stockV - cost, pnlP = cost ? pnl / cost * 100 : 0;

          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + m[0] + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"></path></svg>' +
          '<b style="color:' + m[0] + '">' + (b.r === 1 ? '우승' : b.r + '위') + '</b><span>' + esc(b.s) + '</span></div>';

  function seasonLeft() {
    if (!state.season) return '';
    var ms = state.season.end - Date.now();
    if (ms <= 0) return '곧 마감';
    var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
    return (d ? d + '일 ' + h + '시간' : h ? h + '시간 ' + m + '분' : m + '분') + ' 남음';
  }

  function viewRanking() {
    var season = (ui.rankTab || 'season') === 'season';
    var r = season ? seasonRankings() : rankings(), top = r.slice(0, 3);
    function pod(x, i) {

        (i === 0 ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path></svg>' : '') +
        '<span class="r r' + (i + 1) + '">' + (i + 1) + '위</span><b>' + nameHtml(x.name, x.title) + '</b><span class="pod-t">Lv.' + x.lv + ' · ' + x.title.name + '</span>' +
        '<small class="num ' + cls(x.ret) + '">' + pct(x.ret) + '</small>' + (season ? '<span class="pod-t">보상 ' + ['1,000만', '500만', '300만'][i] + '</span>' : '') + '</div>';
    }

      '<p class="sub">' + (season ? '시즌 수익률 기준 · ' + seasonLeft() + ' · 참가 ' + r.length + '명' : '누적 순자산 기준 · 참가 ' + r.length + '명') + '</p></header>' +
      '<div class="seg rank-seg" role="group" aria-label="랭킹 종류"><button class="' + (season ? 'on' : '') + '" data-action="rank-tab" data-key="season" type="button" aria-pressed="' + season + '">시즌</button>' +
      '<button class="' + (!season ? 'on' : '') + '" data-action="rank-tab" data-key="all" type="button" aria-pressed="' + !season + '">전체</button></div>' +
      (r.length < 2 ? '<div class="empty">지금은 혼자 플레이 중이에요.<br>친구가 들어오면 여기 함께 표시돼요.</div>' : '') +

          : '<span class="end"><b class="num">' + fmt(x.total) + '원</b><span class="num ' + cls(x.ret) + '">' + pct(x.ret) + '</span></span>') + '</div>';

      var past = state.pastSeasons || [];

        html += '<div class="sec-head"><h2>지난 시즌</h2></div><div class="past">';
        past.forEach(function (ps) {
          html += '<div class="past-row"><b>' + esc(ps.name) + '</b><span>' + (ps.results || []).map(function (x) {
            return '<span class="num">' + x.rank + '위 ' + esc(x.nick) + ' <span class="' + cls(Number(x.ret)) + '">' + pct(Number(x.ret)) + '</span></span>';
          }).join('') + '</span></div>';
        });
        html += '</div>';
      }
    }
    return html;
  }

  function timeLeft(ticks) {

  function viewBank() {

    var html = '<header class="topbar stick"><h1 class="brand">개미 은행</h1><span class="pill"><span class="dot"></span><span>Day ' + day() + ' · <b class="num" id="cd">60</b>초</span></span></header>' +

    // 은행 현황

    html += '<section class="card" aria-label="은행 현황"><div class="split"><h2 style="margin:0;font-size:16px">은행 현황</h2>' +

    var cut1 = html.length;
    // 대출
    var lim = loanLimit(), av = loanAvail(), due = loanInterestDue();
    html += '<section class="card product" aria-label="대출"><div class="split"><h2>대출</h2><span class="tag up">하루 ' + LOAN_RATE + '%</span></div>' +
      '<p class="note">순자산(대출 제외)의 ' + (LOAN_LTV * 100) + '%까지 빌릴 수 있어요. 이자는 매일 마감 때 현금에서 빠지고, 현금이 모자라면 대출에 더해져요. 대출이 남아 있으면 처음부터 다시 하기를 할 수 없어요.</p>' +

      '<button class="btn-loan wide" data-action="loan-take" type="button"' + (av >= LOAN_MIN ? '' : ' disabled') + '>' + (av >= LOAN_MIN ? '대출 받기' : '지금은 빌릴 수 있는 금액이 없어요') + '</button>';

  function dayEndToast(t) {
    var ev = (state.myEvents || []).filter(function (e) { return e.tick === t; }), parts = [];
    var div = ev.filter(function (e) { return e.kind === 'div'; }).reduce(function (a, e) { return a + e.amt; }, 0);
    var intr = ev.filter(function (e) { return e.kind === 'bank' && /이자/.test(e.text) && e.amt > 0; }).reduce(function (a, e) { return a + e.amt; }, 0);
    if (div) parts.push('배당금 +' + fmt(div) + '원');
    if (intr) parts.push('이자 +' + fmt(intr) + '원');
    ev.forEach(function (e) {
      if (e.kind !== 'bank') return;
      if (/만기/.test(e.text)) parts.push(e.text + ' +' + fmt(e.amt) + '원');
      else if (/대출 이자 납부/.test(e.text)) parts.push('대출 이자 −' + fmt(-e.amt) + '원');

  // ---------- 버튼 효과음: 나무 키보드 '오도독' 소리를 직접 합성 ----------
  var sfxOn = true, actx = null, noiseBuf = null;
  try { sfxOn = localStorage.getItem('ant-sfx') !== '0'; } catch (e) {}
  function audioCtx() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC();
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.06), actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tick(ctx, t, freq, q, vol, len) {
    var src = ctx.createBufferSource(); src.buffer = noiseBuf;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.001); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + len + 0.01);
  }
  function thock(ctx, t, f0, vol) {
    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.05);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.08);
  }
  function keyClick() {
    if (!sfxOn) return;
    var ctx = audioCtx(); if (!ctx) return;
    var t = ctx.currentTime + 0.002, r = 0.88 + Math.random() * 0.24;
    thock(ctx, t, 190 * r, 0.32);                       // 나무 바닥에 닿는 둥근 소리
    tick(ctx, t, 1900 * r, 1.4, 0.22, 0.035);           // 키캡이 바닥 치는 소리
    tick(ctx, t + 0.018 + Math.random() * 0.01, 3200 * r, 2, 0.07, 0.02);  // 살짝 튕기는 두 번째 소리 (오도'독')
  }
  // 손을 뗄 때 '눌렀다'고 확정된 경우(click)에만 소리. 스크롤하려고 화면을 끌 때는 click이 안 생겨서 소리가 안 남
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, a, [data-action]');
    if (!el || el.disabled) return;
    keyClick();
  }, true);
  function setSfx(on) {
    sfxOn = on;
    try { localStorage.setItem('ant-sfx', on ? '1' : '0'); } catch (e) {}
  }

  // ---------- 배경 음악 ----------
  var bgm = document.getElementById('bgm'), bgmBtn = document.getElementById('bgm-btn');
  var bgmOn = false;
  try { bgmOn = localStorage.getItem('ant-bgm') === '1'; } catch (e) {}
  bgm.volume = 0.35;
  function bgmPaint() {
    bgmBtn.classList.toggle('on', bgmOn);
    bgmBtn.setAttribute('aria-pressed', String(bgmOn));
    bgmBtn.setAttribute('aria-label', bgmOn ? '배경 음악 끄기' : '배경 음악 켜기');
  }
  function bgmPlay() {
    if (!bgmOn || document.hidden) return;
    if (bgm.preload !== 'auto') bgm.preload = 'auto';
    var pr = bgm.play();
    if (pr && pr.catch) pr.catch(function () {});
  }
  bgmBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    bgmOn = !bgmOn;
    try { localStorage.setItem('ant-bgm', bgmOn ? '1' : '0'); } catch (err) {}
    bgmPaint();
    if (bgmOn) bgmPlay(); else bgm.pause();
  });
  // 브라우저는 사용자가 한 번 터치해야 소리를 낼 수 있어서, 켜둔 상태면 첫 터치에 재생
  document.addEventListener('pointerdown', function () { if (bgmOn && bgm.paused) bgmPlay(); }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden) bgm.pause(); else bgmPlay(); });
  bgmPaint();

  ui.bk = { sav: 0, dep: 0, depTerm: '6', plan: 0, planTerm: '6', loan: 0, repay: 0 };
  state = blankState();

  var entering = false;
  sb.auth.onAuthStateChange(function (event, s) {
    session = s;
    if (s) {
      // 콜백 안에서 바로 서버를 부르면 멈출 수 있어서 한 박자 늦게 시작
      if (!booted && !entering) { entering = true; setTimeout(function () { enterGame().finally(function () { entering = false; }); }, 0); }
    } else {
      booted = false; state = blankState();
      if (channel) { sb.removeChannel(channel); channel = null; }
      renderAuth();
    }
  });
  sb.auth.getSession().then(function (r) { if (!r.data.session) renderAuth(); });

  setInterval(function () {
    if (!booted) return;
    updateCountdown();
  }, 250);
  // 실시간 신호를 놓쳤을 때를 위한 확인 (20초마다)
  setInterval(function () {
    if (!booted || refreshing) return;
    sb.from('game').select('tick').eq('id', 1).single().then(function (r) {
      if (r.data && r.data.tick !== state.tick) refreshAll(true);
    });
  }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && booted) refreshAll(false); });

})();
</script>
</body>
</html>
